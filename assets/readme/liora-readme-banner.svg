<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 1536 385" width="1536" height="385"
role="img" aria-labelledby="title desc">
<title id="title">Liora animated banner</title>
<desc id="desc">A neon blue and violet animated Liora banner with a large central wordmark.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#030713"/>
    <stop offset=".5" stop-color="#080E21"/>
    <stop offset="1" stop-color="#0D102A"/>
  </linearGradient>

  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#38DBFF"/>
    <stop offset=".5" stop-color="#7584FF"/>
    <stop offset="1" stop-color="#E47DFF"/>
  </linearGradient>

  <linearGradient id="logo" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#45DFFF"/>
    <stop offset=".42" stop-color="#A2A5FF"/>
    <stop offset="1" stop-color="#F19BFF"/>
  </linearGradient>

  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <clipPath id="frame">
    <rect x="2" y="2" width="1532" height="381" rx="30"/>
  </clipPath>
</defs>

<!-- Image limit -->
<rect x="2" y="2" width="1532" height="381" rx="30"
      fill="url(#bg)" stroke="url(#neon)" stroke-width="3"/>

<g clip-path="url(#frame)">

  <!-- restrained ambient light -->
  <circle cx="210" cy="190" r="150" fill="#35D9FF" opacity=".08" filter="url(#softGlow)">
    <animate attributeName="cx" values="210;300;210" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="190;155;190" dur="9s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1320" cy="190" r="170" fill="#A76CFF" opacity=".08" filter="url(#softGlow)">
    <animate attributeName="cx" values="1320;1230;1320" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="190;225;190" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- orbiting lines -->
  <path d="M55 205 C250 48 500 45 770 190 C1035 335 1280 330 1480 165"
        fill="none" stroke="url(#neon)" stroke-width="2" opacity=".25"
        stroke-dasharray="11 18">
    <animate attributeName="stroke-dashoffset" values="0;-58" dur="6s"
             repeatCount="indefinite"/>
  </path>

  <path d="M55 250 C280 350 540 320 770 195 C1010 70 1260 70 1480 230"
        fill="none" stroke="url(#neon)" stroke-width="2" opacity=".20"
        stroke-dasharray="8 20">
    <animate attributeName="stroke-dashoffset" values="0;56" dur="7s"
             repeatCount="indefinite"/>
  </path>

  <!-- document -->
  <g transform="translate(225 88)" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate"
      values="225 88;225 76;225 88" dur="4.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" additive="sum" type="rotate"
      values="-7;5;-7" dur="6s" repeatCount="indefinite"/>
    <rect x="-30" y="-38" width="60" height="76" rx="13"
          fill="#091229" stroke="#65DFFF" stroke-width="2.5"/>
    <path d="M-15 -16H16M-15 0H16M-15 16H7"
          stroke="#DC86FF" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- calendar -->
  <g transform="translate(380 285)" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate"
      values="380 285;380 273;380 285" dur="5.2s" repeatCount="indefinite"/>
    <rect x="-34" y="-28" width="68" height="56" rx="13"
          fill="#091229" stroke="#9B7DFF" stroke-width="2.5"/>
    <path d="M-34 -8H34M-17 -37V-17M17 -37V-17"
          stroke="#9B7DFF" stroke-width="3" stroke-linecap="round"/>
    <g fill="#55DFFF">
      <circle cx="-16" cy="7" r="4"/><circle cx="0" cy="7" r="4"/><circle cx="16" cy="7" r="4"/>
      <circle cx="-16" cy="21" r="4"/><circle cx="0" cy="21" r="4"/><circle cx="16" cy="21" r="4"/>
    </g>
  </g>

  <!-- folder -->
  <g transform="translate(1240 90)" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate"
      values="1240 90;1240 78;1240 90" dur="5.1s" repeatCount="indefinite"/>
    <rect x="-40" y="-29" width="80" height="58" rx="13"
          fill="#091229" stroke="#55DFFF" stroke-width="2.5"/>
    <path d="M-25 -10H-7L1-2H27V21H-25Z"
          fill="#55DFFF" fill-opacity=".17" stroke="#55DFFF" stroke-width="2"/>
  </g>

  <!-- video -->
  <g transform="translate(1360 270)" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate"
      values="1360 270;1360 258;1360 270" dur="4.4s" repeatCount="indefinite"/>
    <rect x="-39" y="-29" width="78" height="58" rx="14"
          fill="#091229" stroke="#E980DC" stroke-width="2.5"/>
    <path d="M-9 -16L20 0L-9 16Z" fill="#E980DC"/>
  </g>

  <!-- compass -->
  <g transform="translate(1135 292)" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate"
      values="1135 292;1135 280;1135 292" dur="5.8s" repeatCount="indefinite"/>
    <circle r="36" fill="#091229" stroke="#4BDEFF" stroke-width="2.5"/>
    <path d="M-16 18L-5-13L18-20L7 11Z"
          fill="#4BDEFF" fill-opacity=".2" stroke="#4BDEFF" stroke-width="2"/>
    <circle r="4" fill="#C17DFF"/>
  </g>

  <!-- sparkle accents -->
  <g filter="url(#glow)">
    <path d="M535 82l6 15 15 6-15 6-6 15-6-15-15-6 15-6z" fill="#58E2FF">
      <animateTransform attributeName="transform" type="scale"
        values="1;1.25;1" dur="2.7s" repeatCount="indefinite"/>
    </path>
    <path d="M1005 72l7 17 17 7-17 7-7 17-7-17-17-7 17-7z" fill="#E88CFF">
      <animateTransform attributeName="transform" type="scale"
        values="1;1.18;1" dur="3.1s" repeatCount="indefinite"/>
    </path>
    <circle cx="1070" cy="105" r="4" fill="#5DE2FF">
      <animate attributeName="r" values="3;7;3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- =========================================================
       MAIN WORDMARK — deliberately much larger
       ========================================================= -->
  <g transform="translate(768 190)">
    <text x="0" y="63"
          text-anchor="middle"
          font-family="Inter,Segoe UI,Arial,sans-serif"
          font-size="190"
          font-weight="800"
          letter-spacing="-11"
          fill="url(#logo)"
          filter="url(#glow)">Liora</text>

    <!-- animated underline -->
    <path d="M-275 104 C-130 56 130 56 275 104"
          fill="none" stroke="url(#neon)" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="0 600">
      <animate attributeName="stroke-dasharray"
        values="0 600;555 45;0 600"
        dur="5s" repeatCount="indefinite"/>
    </path>

    <!-- sparkle above the logo -->
    <path d="M0-128l7 17 17 7-17 7-7 17-7-17-17-7 17-7z"
          fill="#EA8DFF" filter="url(#glow)">
      <animateTransform attributeName="transform" type="scale"
        values="1;1.16;1" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- moving orbital particles -->
  <g filter="url(#glow)">
    <circle r="5" fill="#58E2FF">
      <animateMotion dur="7s" repeatCount="indefinite"
        path="M55 205 C250 48 500 45 770 190 C1035 335 1280 330 1480 165"/>
    </circle>
    <circle r="4" fill="#D47FFF">
      <animateMotion dur="8.5s" begin="-2s" repeatCount="indefinite"
        path="M55 250 C280 350 540 320 770 195 C1010 70 1260 70 1480 230"/>
    </circle>
  </g>

  <!-- tiny drifting particles -->
  <g fill="#67E5FF">
    <circle cx="135" cy="70" r="2">
      <animate attributeName="cy" values="70;59;70" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="330" r="2">
      <animate attributeName="cy" values="330;318;330" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="48" r="2">
      <animate attributeName="cy" values="48;38;48" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1470" cy="105" r="2">
      <animate attributeName="cy" values="105;94;105" dur="3.3s" repeatCount="indefinite"/>
    </circle>
  </g>
</g>

<!-- rounded border is the absolute outer boundary -->
<rect x="2" y="2" width="1532" height="381" rx="30"
      fill="none" stroke="url(#neon)" stroke-width="3"/>
</svg>