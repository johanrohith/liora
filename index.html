<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="shortcut icon" href="./assets/icons/icon-192.png" type="image/png">
<link rel="preload" href="./assets/icons/icon-512.png" as="image">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<meta name="application-name" content="Liora">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Liora — one connected personal environment.">
<title>Liora — One personal environment</title>
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<div id="boot" aria-hidden="true">
  <div class="boot-core"><img class="boot-mark" src="./assets/icons/icon-512.png" alt="Liora"> <div class="boot-name">Liora</div><div class="boot-line"><span></span></div></div>
</div>

<div class="app-shell">
  <aside class="side-rail">
    <div class="brand"><div class="brand-mark">L</div><div class="brand-copy"><div class="brand-name">Liora</div><div class="brand-sub">Personal environment</div></div></div>
    <div class="rail-section-label">Your spaces</div>
    <nav class="nav-list" id="desktopNav"></nav>
    <div class="rail-spacer"></div>
    <div class="rail-footer">
      <button class="rail-action" data-action="quick">＋<span>Quick action</span></button>
      <button class="rail-action" data-page="settings">⚙<span>Settings</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <div class="eyebrow">Liora</div>
        <div class="page-title" id="pageTitle">Home</div>
        <div class="page-sub" id="pageSub">Everything important, at a glance.</div>
        <div class="network-status" id="networkStatus" aria-live="polite">Online · offline ready</div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="searchBtn" title="Search" aria-label="Search">⌕</button>
        <button class="icon-btn" id="notifyBtn" title="Notifications" aria-label="Notifications">♧<span class="notif-dot" id="notifyDot" hidden></span></button>
        <div class="top-more">
          <button class="icon-btn" id="moreBtn" title="More" aria-label="More">•••</button>
          <div class="more-menu" id="moreMenu">
            <button data-action="quick">＋ Quick action</button>
            <button data-page="settings">⚙ Settings</button>
          </div>
        </div>
      </div>
    </header>

    <div class="content">
      <section id="home" class="page active"></section>
      <section id="planner" class="page"></section>
      <section id="notes" class="page"></section>
      <section id="wallet" class="page"></section>
      <section id="connect" class="page"></section>
      <section id="media" class="page"></section>
      <section id="travel" class="page"></section>
      <section id="discover" class="page"></section>
      <section id="ai" class="page"></section>
      <section id="settings" class="page"></section>
    </div>
  </main>
</div>

<div class="mobile-bar"><nav class="mobile-dock" id="mobileDock"></nav></div>
<div class="overlay" id="overlay"></div>

<section class="sheet" id="mobileSheet" aria-hidden="true">
  <div class="sheet-handle"></div>
  <div class="row" style="margin-bottom:12px"><div><strong>Liora</strong><div class="small muted">Everything else, one tap away.</div></div><button class="icon-btn small-icon" id="closeSheet" aria-label="Close">×</button></div>
  <div class="mobile-sheet-grid" id="mobileAppGrid"></div>
</section>

<aside class="drawer" id="notifDrawer" aria-hidden="true">
  <div class="drawer-head"><div class="row"><div><div class="eyebrow">Attention</div><h2 style="font-size:22px;margin-top:4px">Notifications</h2><div class="small muted" style="margin-top:6px">Only items that may need attention.</div></div><button class="icon-btn" id="closeNotif" aria-label="Close notifications">×</button></div></div>
  <div class="stack section-gap" id="notifContent"></div>
</aside>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-box">
    <div class="row" style="margin-bottom:14px"><div><div class="eyebrow">Liora</div><h2 id="modalTitle" style="font-size:22px;margin-top:4px">Liora</h2></div><button class="icon-btn" id="closeModal" aria-label="Close">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast" aria-live="polite"></div>

<!-- Spotify Embed API -->
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>

<script src="./js/app.js" defer></script>
</body>
</html>
